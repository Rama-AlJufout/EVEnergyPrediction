    <path d="M125 48 L201 28 Q244 22 280 51 L300 70 L106 70 Z" fill="#143a5e" stroke="#7cf9f1" stroke-width="3"/>
    <path d="M306 75 L347 104 L354 119 L319 119 Z" fill="#164b6c" stroke="#7cf9f1" stroke-width="3"/>
    <circle cx="91" cy="143" r="31" fill="#07111f" stroke="#62f3e7" stroke-width="6"/>
    <circle cx="91" cy="143" r="12" fill="#8ef8ed"/>
    <circle cx="310" cy="143" r="31" fill="#07111f" stroke="#62f3e7" stroke-width="6"/>
