<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">EV Energy Prediction project cover</title>
  <desc id="desc">A stylized electric vehicle driving through a data-powered landscape.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07142d"/>
      <stop offset="0.55" stop-color="#123a63"/>
      <stop offset="1" stop-color="#0b827b"/>
    </linearGradient>
    <linearGradient id="road" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#19334d"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="car" x1="0" x2="1">
      <stop offset="0" stop-color="#28d7c6"/>
      <stop offset="1" stop-color="#65f0ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1500" height="500" fill="url(#sky)"/>
  <circle cx="1250" cy="90" r="52" fill="#8ef8ed" opacity=".8" filter="url(#glow)"/>
