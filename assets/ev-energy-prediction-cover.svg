  <path d="M100 432 L235 427 M340 420 L475 415 M580 408 L715 403 M820 395 L955 390 M1060 382 L1195 377 M1300 369 L1435 364" stroke="#d4fff8" stroke-width="8" stroke-linecap="round" opacity=".85"/>
