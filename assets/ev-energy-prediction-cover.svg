    <path d="M80 120 L80 270 M80 150 L190 150 L190 270"/>
    <path d="M225 95 L225 270 M225 120 L335 120 L335 270"/>
    <path d="M370 165 L370 270 M370 190 L480 190 L480 270"/>
  </g>
  <g fill="#8ef8ed">
